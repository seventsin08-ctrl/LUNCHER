name: Launcher pages and folder smoke test
on:
  push:
    branches: [codex/pages-groups-6]
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build preview
        run: ./gradlew assemblePreview --stacktrace
      - name: Enable virtual machine acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check pages, groups and drag cleanup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/pages-picker-smoke.sh && bash scripts/folder-ghost-smoke.sh
      - name: Save UI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-groups-smoke-results
          path: |
            page-smoke/
            smoke-output/
          if-no-files-found: ignore
