name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assemblePreview --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Luncher.apk
          cp app/build/outputs/apk/preview/app-preview.apk Luncher-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luncher-apk
          path: |
            Luncher.apk
            Luncher-preview.apk

      - name: Publish to "latest" release (easy phone download)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Apple Launcher (latest build)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Luncher.apk
          body: |
            Latest Luncher build from commit ${{ github.sha }}.
            Download **Luncher.apk** below on your Android phone and open it to install.
